<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Turno - Sala de Juegos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #f8fafc;
            background-image: radial-gradient(circle at 50% 0%, #e2e8f0 0%, transparent 75%);
        }
        ::-webkit-calendar-picker-indicator {
            opacity: 0.6;
            cursor: pointer;
        }
    </style>
</head>
<body class="text-gray-800 min-h-screen font-sans antialiased">
    <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
        
        <div class="mb-8 border-b border-gray-300 pb-6">
            <h1 class="text-4xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-b from-green-400 via-green-600 to-green-800 drop-shadow-sm">
                Registrar Turno
            </h1>
            <p class="mt-2 text-gray-500">Completa los datos para agendar una nueva sesión de juego.</p>
        </div>
        
        <form action="/nueva_reserva" method="POST" class="bg-white/90 backdrop-blur-sm rounded-xl border border-gray-200 shadow-xl p-6 md:p-8">
            
            <div class="mb-8">
                <legend class="text-xl font-bold text-green-700 mb-4 flex items-center gap-2 border-b border-gray-200 pb-2 w-full drop-shadow-sm">
                    Datos Personales
                </legend>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-4">
                    <div class="md:col-span-2">
                        <label for="dni" class="block text-sm font-medium text-gray-700 mb-1">DNI:</label>
                        <input type="number" name="dni" id="dni" required placeholder="Ingresa tu DNI" 
                            class="w-full bg-gray-50 border border-gray-300 rounded-lg px-4 py-2.5 text-gray-800 placeholder-gray-400 shadow-inner focus:outline-none focus:border-green-500 focus:ring-1 focus:ring-green-500 transition-colors">
                    </div>
                    <div>
                        <label for="nombre" class="block text-sm font-medium text-gray-700 mb-1">Nombre:</label>
                        <input type="text" name="nombre" id="nombre" required placeholder="Tu nombre"
                            class="w-full bg-gray-50 border border-gray-300 rounded-lg px-4 py-2.5 text-gray-800 placeholder-gray-400 shadow-inner focus:outline-none focus:border-green-500 focus:ring-1 focus:ring-green-500 transition-colors">
                    </div>
                    <div>
                        <label for="apellido" class="block text-sm font-medium text-gray-700 mb-1">Apellido:</label>
                        <input type="text" name="apellido" id="apellido" required placeholder="Tu apellido"
                            class="w-full bg-gray-50 border border-gray-300 rounded-lg px-4 py-2.5 text-gray-800 placeholder-gray-400 shadow-inner focus:outline-none focus:border-green-500 focus:ring-1 focus:ring-green-500 transition-colors">
                    </div>
                    <div class="md:col-span-2">
                        <label for="correo" class="block text-sm font-medium text-gray-700 mb-1">Correo Electrónico:</label>
                        <input type="email" name="correo" id="correo" required placeholder="ejemplo@correo.com"
                            class="w-full bg-gray-50 border border-gray-300 rounded-lg px-4 py-2.5 text-gray-800 placeholder-gray-400 shadow-inner focus:outline-none focus:border-green-500 focus:ring-1 focus:ring-green-500 transition-colors">
                    </div>
                </div>
            </div>

            <div class="mb-8">
                <legend class="text-xl font-bold text-green-700 mb-4 flex items-center gap-2 border-b border-gray-200 pb-2 w-full drop-shadow-sm">
                    Detalles del Turno
                </legend>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-4">
                    
                    <div class="md:col-span-2">
                        <label for="juego" class="block text-sm font-medium text-gray-700 mb-1">Juego Solicitado:</label>
                        <select name="juego" id="juego" required
                            class="w-full bg-gray-50 border border-green-500/50 rounded-lg px-4 py-2.5 text-green-800 shadow-inner focus:outline-none focus:border-green-600 focus:ring-1 focus:ring-green-600 transition-colors">
                            <option value="" disabled selected>Selecciona un juego de la lista...</option>
                            
                            <!-- Bucle Jinja2 para cargar los juegos desde la base de datos -->
                            {% for j in juegos %}
                                <option value="{{ j.id_juego }}">{{ j.nombre }}</option>
                            {% endfor %}
                            
                        </select>
                    </div>

                    <div>
                        <label for="fecha" class="block text-sm font-medium text-gray-700 mb-1">Día de Reserva:</label>
                        <input type="date" name="fecha" id="fecha" required
                            class="w-full bg-gray-50 border border-gray-300 rounded-lg px-4 py-2.5 text-gray-800 shadow-inner focus:outline-none focus:border-green-500 focus:ring-1 focus:ring-green-500 transition-colors">
                    </div>
                    <div>
                        <label for="hora" class="block text-sm font-medium text-gray-700 mb-1">Hora de Inicio:</label>
                        <input type="time" name="hora" id="hora" required
                            class="w-full bg-gray-50 border border-gray-300 rounded-lg px-4 py-2.5 text-gray-800 shadow-inner focus:outline-none focus:border-green-500 focus:ring-1 focus:ring-green-500 transition-colors">
                    </div>
                    <div>
                        <label for="duracion" class="block text-sm font-medium text-gray-700 mb-1">Tiempo de Reserva:</label>
                        <select name="duracion" id="duracion" required
                            class="w-full bg-gray-50 border border-gray-300 rounded-lg px-4 py-2.5 text-gray-800 shadow-inner focus:outline-none focus:border-green-500 focus:ring-1 focus:ring-green-500 transition-colors">
                            <option value="30">30 Minutos</option>
                            <option value="60">60 Minutos (1 Hora)</option>
                            <option value="90">90 Minutos (1 Hora y media)</option>
                        </select>
                    </div>
                    <div>
                        <label for="acompanado" class="block text-sm font-medium text-gray-700 mb-1">¿Vienes acompañado?</label>
                        <select name="acompanado" id="acompanado" required
                            class="w-full bg-gray-50 border border-gray-300 rounded-lg px-4 py-2.5 text-gray-800 shadow-inner focus:outline-none focus:border-green-500 focus:ring-1 focus:ring-green-500 transition-colors">
                            <option value="0">No, voy solo</option>
                            <option value="1">Sí, vengo con alguien</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="mb-6 bg-gray-100 p-4 rounded-lg border border-gray-300 shadow-inner">
                <label class="flex items-start gap-3 cursor-pointer">
                    <input type="checkbox" required class="mt-1 w-5 h-5 text-green-600 border-gray-400 rounded focus:ring-green-500 focus:ring-2">
                    <span class="text-sm text-gray-700 font-medium">Acepto los términos y condiciones, y me hago responsable por los daños ocasionados al equipo, controles o juegos durante mi turno. Entiendo que mi código de reserva será enviado al correo proporcionado.</span>
                </label>
            </div>

            <div class="flex items-center justify-end gap-4 mt-8 pt-6 border-t border-gray-200">
                <a href="/" class="px-6 py-2.5 text-sm font-medium text-gray-500 hover:text-gray-800 transition-colors">
                    Cancelar
                </a>
                <button type="submit" class="inline-flex items-center justify-center px-6 py-2.5 border border-green-800 text-sm font-bold rounded-lg text-white bg-gradient-to-b from-green-400 via-green-500 to-green-700 hover:from-green-300 hover:via-green-400 hover:to-green-600 shadow-[inset_0_1px_1px_rgba(255,255,255,0.5),0_4px_10px_rgba(22,163,74,0.4)] transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-white focus:ring-green-600">
                    Guardar Reserva
                </button>
            </div>
        </form>
    </div>
</body>
</html>
